name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run scripts/verify-package.ts
      - run: bunx playwright install --with-deps chromium firefox webkit
      # The standalone audio experiment is outside the number-package release checks.
      - run: bun run test:browser --grep-invert 'sound|audio' --workers=1
      - run: bun run build:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
